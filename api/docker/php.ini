; Ajustes mínimos de produção — sem opinião sobre limites de negócio
; (esses vivem em config/timersmit.php e na tabela `policies`).
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
