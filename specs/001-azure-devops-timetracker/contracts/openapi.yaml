openapi: 3.1.0
info:
  title: SMIT TimeTrack API
  version: 0.1.0-draft
  description: >-
    Contrato inicial. O esquema de autenticação é provisório até conclusão da prova
    técnica documentada em research.md. Não implementar este bearer como token
    Azure DevOps sem validação de emissor, audiência e organização.
servers:
  - url: https://api.example.invalid/v1
security:
  - BackendSession: []
components:
  securitySchemes:
    BackendSession:
      type: http
      scheme: bearer
      description: Sessão curta emitida pelo backend após troca verificável de identidade; desenho pendente.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    Timer:
      type: object
      description: >-
        `id` é opaco (identificador interno do backend), não um GUID do
        Azure DevOps — só `projectId`/`workItemId` vêm do Azure DevOps.
      required: [id, workItemId, startedAtUtc, status]
      properties:
        id: { type: string }
        workItemId: { type: integer, minimum: 1 }
        startedAtUtc: { type: string, format: date-time }
        status: { type: string, enum: [active, stopped] }
        activityTypeId: { type: [string, 'null'] }
    Entry:
      type: object
      required: [id, workItemId, localDate, timezone, durationSeconds, source, billable]
      properties:
        id: { type: string }
        workItemId: { type: integer, minimum: 1 }
        localDate: { type: string, format: date }
        timezone: { type: string, example: America/Sao_Paulo }
        durationSeconds: { type: integer, minimum: 1 }
        startTime: { type: [string, 'null'], example: '09:00', description: 'Hora local de início (HH:MM); nulo se o lançamento não tem horário.' }
        endTime: { type: [string, 'null'], example: '10:30', description: 'Início + duração, em hora local.' }
        source: { type: string, enum: [timer, manual] }
        billable: { type: boolean }
        activityTypeId: { type: string }
        note: { type: string, maxLength: 2000 }
        revision: { type: integer, minimum: 1 }
    Week:
      type: object
      description: >-
        Semana de segunda a domingo, datas locais. Totais em segundos, calculados
        no servidor a partir das mesmas linhas de `entries`. Sem linha de envio
        a semana é `open`.
      required: [weekStartDate, weekEndDate, status, revision, totalSeconds, days, entries]
      properties:
        weekStartDate: { type: string, format: date, description: Segunda-feira. }
        weekEndDate: { type: string, format: date }
        status: { type: string, enum: [open, submitted, rejected, approved] }
        revision: { type: integer, minimum: 0, description: Número do último envio (0 = nunca enviada). }
        submittedAt: { type: [string, 'null'], format: date-time }
        totalSeconds: { type: integer, minimum: 0 }
        decisions:
          type: array
          description: Histórico de decisões da semana (nada é apagado ao reenviar).
          items:
            type: object
            required: [revision, decision, decidedAt]
            properties:
              revision: { type: integer, minimum: 1 }
              decision: { type: string, enum: [approved, rejected, reopened] }
              reason: { type: [string, 'null'] }
              approverName: { type: [string, 'null'] }
              selfDecision: { type: boolean, description: Administrador decidindo a própria semana. }
              decidedAt: { type: string, format: date-time }
        days:
          type: array
          description: Os 7 dias da semana, com total (0 quando vazio).
          items:
            type: object
            required: [date, totalSeconds]
            properties:
              date: { type: string, format: date }
              totalSeconds: { type: integer, minimum: 0 }
        entries:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Entry' }
              - type: object
                description: Campos de exibição (título/tipo vêm do snapshot mais recente do work item).
                properties:
                  projectId: { type: string, description: GUID do projeto no Azure DevOps. }
                  projectName: { type: string }
                  workItemTitle: { type: [string, 'null'] }
                  workItemType: { type: [string, 'null'] }
                  activityTypeName: { type: [string, 'null'] }
                  activityTypeColor: { type: [string, 'null'] }
    Month:
      type: object
      description: >-
        Horas por data local no mês. Uma semana que atravessa o mês aparece nos
        dois, cada dia no seu mês; a unidade de aprovação segue sendo a semana.
      required: [month, totalSeconds, days, weeks]
      properties:
        month: { type: string, example: '2026-09' }
        totalSeconds: { type: integer, minimum: 0 }
        days:
          type: array
          description: Só os dias com lançamento.
          items:
            type: object
            required: [date, totalSeconds]
            properties:
              date: { type: string, format: date }
              totalSeconds: { type: integer, minimum: 1 }
        weeks:
          type: array
          description: Semanas que tocam o mês, com o estado de cada uma.
          items:
            type: object
            required: [weekStartDate, status]
            properties:
              weekStartDate: { type: string, format: date }
              status: { type: string, enum: [open, submitted, rejected, approved] }
paths:
  /activity-types:
    get:
      operationId: listActivityTypes
      description: Tipos de atividade habilitados do tenant (cria o conjunto padrão na primeira chamada).
      responses:
        '200':
          description: Lista ordenada por nome.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, defaultBillable]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    color: { type: [string, 'null'], description: '#RRGGBB para o seletor.' }
                    defaultBillable: { type: boolean }
        '401': { description: Não autenticado }
  /me/timer:
    get:
      operationId: getActiveTimer
      responses:
        '200':
          description: Timer atual ou null.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Timer' }
                  - { type: 'null' }
        '401': { description: Não autenticado }
    post:
      operationId: startTimer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, projectName, workItemId]
              properties:
                projectId: { type: string, format: uuid, description: GUID do projeto no Azure DevOps. }
                projectName: { type: string, description: Nome do projeto no momento da chamada (afirmação do cliente; ver WorkItemAccessService). }
                workItemId: { type: integer, minimum: 1 }
                activityTypeId: { type: string, description: ID interno de um tipo de atividade do tenant. }
                title: { type: string, description: 'Título do work item, lido do form já aberto — cosmético.' }
                workItemType: { type: string, description: 'Tipo do work item, lido do form já aberto — cosmético.' }
      responses:
        '201':
          description: Timer iniciado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timer' }
        '403': { description: Projeto/item inacessível }
        '409': { description: Já existe timer ativo para outro item }
  /me/timer/stop:
    post:
      operationId: stopTimer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timerId]
              properties:
                timerId: { type: string }
                note: { type: string, maxLength: 2000 }
                billable: { type: boolean }
      responses:
        '200':
          description: Timer fechado; uma ou mais fatias diárias geradas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entry' }
        '409': { description: Timer já fechado por outra operação ou semana bloqueada }
  /entries:
    post:
      operationId: createManualEntry
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, projectName, workItemId, localDate, durationSeconds]
              properties:
                projectId: { type: string, format: uuid, description: GUID do projeto no Azure DevOps. }
                projectName: { type: string }
                workItemId: { type: integer, minimum: 1 }
                localDate: { type: string, format: date }
                durationSeconds: { type: integer, minimum: 1 }
                startTime: { type: string, example: '09:00', description: 'Opcional. Hora local de início (HH:MM); início + duração não pode passar da meia-noite (422).' }
                activityTypeId: { type: string }
                billable: { type: boolean }
                note: { type: string, maxLength: 2000 }
                title: { type: string }
                workItemType: { type: string }
      responses:
        '201':
          description: Entrada criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '422': { description: Regra de duração/data/comentário violada }
  /entries/{entryId}:
    patch:
      operationId: updateEntry
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSeconds: { type: integer, minimum: 1 }
                startTime: { type: [string, 'null'], description: 'HH:MM define o início (o fim acompanha a duração); null apaga o horário. Mudar só a duração de um lançamento com horário move o fim.' }
                note: { type: string, maxLength: 2000 }
                billable: { type: boolean }
      responses:
        '200':
          description: Entrada atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '403': { description: Sem permissão }
        '409': { description: Revisão divergente ou período bloqueado }
    delete:
      operationId: deleteEntry
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Exclusão lógica concluída }
        '409': { description: Período bloqueado }
  /me/weeks/{weekStartDate}:
    get:
      operationId: getWeek
      description: Semana do próprio usuário. `weekStartDate` precisa ser uma segunda-feira (422 caso contrário).
      parameters:
        - { name: weekStartDate, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Semana do usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Week' }
        '422': { description: A data não é uma segunda-feira }
  /me/months/{month}:
    get:
      operationId: getMonth
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, example: '2026-09' } }
      responses:
        '200':
          description: Horas por data local no mês.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Month' }
  /me/weeks/{weekStartDate}/submit:
    post:
      operationId: submitWeek
      description: >-
        open|rejected → submitted, registrando uma revisão com a versão dos
        lançamentos. Repetir com a mesma Idempotency-Key devolve o mesmo
        resultado. Enquanto enviada ou aprovada, a semana não aceita criar,
        alterar ou excluir lançamentos nem parar timer (409).
      parameters:
        - { name: weekStartDate, in: path, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Semana enviada (corpo igual ao de getWeek).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Week' }
        '409': { description: 'Já enviada ou aprovada, há um timer ativo, ou não há ninguém que possa decidir (nem aprovador designado nem administrador).' }
        '422': { description: Semana sem lançamentos }
  /me/weeks/{weekStartDate}/recall:
    post:
      operationId: recallWeek
      description: >-
        submitted → open, pela própria pessoa, enquanto ninguém decidiu: a
        semana sai da fila de aprovação e volta a aceitar lançamentos; o
        próximo envio cria uma nova revisão. Repetir com a mesma
        Idempotency-Key devolve o mesmo resultado. Auditado como
        `week.recalled`.
      parameters:
        - { name: weekStartDate, in: path, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Semana aberta de novo (corpo igual ao de getWeek).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Week' }
        '409': { description: 'A semana não está enviada (aberta, rejeitada) ou já foi aprovada — aprovada só um administrador reabre.' }
  /approvals:
    get:
      operationId: listApprovals
      description: >-
        `view=pending` (padrão): semanas enviadas que o usuário pode decidir —
        aprovadores designados no envio e administradores. `view=decided`: as
        últimas decisões tomadas por ele.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [pending, decided] } }
      responses:
        '200':
          description: "Lista (pendentes: mais antigas primeiro)."
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /approvals/{submissionId}:
    get:
      operationId: getApproval
      description: Semana do colaborador (mesmo formato de `Week`), quem enviou e o que o usuário pode fazer (`permissions`).
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detalhe para revisão }
        '403': { description: Não pode decidir nem decidiu esta semana }
        '404': { description: Não existe nesta organização }
  /approvals/{submissionId}/decision:
    post:
      operationId: decideWeek
      description: >-
        Decide a semana inteira. A primeira transição válida vence; repetir com
        a mesma Idempotency-Key devolve o mesmo resultado. Só administrador
        decide a própria semana (registrado como `selfDecision`).
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 2000, description: Obrigatório na rejeição. }
                revision: { type: integer, minimum: 1, description: Revisão que o aprovador viu; divergente = 409. }
                unauthorized:
                  type: array
                  description: >-
                    Só ao aprovar: lançamentos com hora adicional que o aprovador não
                    autoriza. A hora continua registrada; o administrador vê o aviso.
                  items:
                    type: object
                    required: [entryId, reason]
                    properties:
                      entryId: { type: integer }
                      reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Decisão registrada (corpo igual ao de getApproval) }
        '403': { description: Usuário não é aprovador designado nem administrador }
        '404': { description: Não existe nesta organização }
        '409': { description: Semana já decidida, fora de "enviada" ou reenviada desde que foi aberta }
        '422': { description: Rejeição sem motivo }
  /approvals/{submissionId}/reopen:
    post:
      operationId: reopenWeek
      description: Administrador reabre uma semana aprovada (volta a `open`), com justificativa auditada.
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Semana reaberta }
        '403': { description: Só administrador }
        '409': { description: A semana não está aprovada }
        '422': { description: Sem justificativa }
  /settings:
    get:
      operationId: getSettings
      description: >-
        Configuração completa da organização (fuso, regras em vigor, projetos,
        atividades, pessoas com papéis e designações de aprovador). Toda a
        família `/settings/*` exige administrador (papel `admin` valendo para a
        organização inteira); os demais recebem 403. Cada alteração devolve
        esta mesma visão já atualizada.
      responses:
        '200': { description: Visão completa }
        '403': { description: Não é administrador }
  /settings/organization:
    put:
      operationId: updateTimezone
      description: Fuso IANA da organização. Vale só para lançamentos novos; os antigos guardam data local e fuso próprios.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [timezone], properties: { timezone: { type: string, example: America/Sao_Paulo } } }
      responses:
        '200': { description: Visão atualizada }
        '422': { description: Fuso inválido }
  /settings/policy:
    put:
      operationId: updatePolicy
      description: >-
        Nova versão das regras de lançamento, válida a partir de agora (as
        versões anteriores ficam guardadas). Incremento e comentário obrigatório
        valem para lançamento manual; limite diário e janela retroativa para
        qualquer lançamento/edição. Timer guarda segundos exatos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationIncrementMinutes, dailyLimitHours, retroactiveWindowDays, commentRequired]
              properties:
                durationIncrementMinutes: { type: integer, enum: [1, 5, 10, 15, 30, 60] }
                dailyLimitHours: { type: integer, minimum: 1, maximum: 24 }
                retroactiveWindowDays: { type: integer, minimum: 0, maximum: 365 }
                commentRequired: { type: boolean }
      responses:
        '200': { description: Visão atualizada }
        '422': { description: Valor inválido }
  /settings/import/7pace:
    post:
      operationId: importSevenPace
      description: >-
        Só administradores. Importa o relatório "Times Explorer" do 7pace
        (.xlsx em base64). Com `dryRun` só simula. Pessoas casam pelo nome (ou
        pelo começo do nome, se único) ou por `personMap` ("none" deixa de
        fora); projetos pelo nome ou pelo GUID em `projectIds` (criados se
        faltarem). Nada é duplicado (`import_ref` por linha), o que já está
        lançado no mesmo horário é pulado e semanas enviadas/aprovadas não
        recebem lançamentos. Auditado (`import.seven_pace`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file, dryRun]
              properties:
                file: { type: string, description: Planilha .xlsx em base64 (até 10 MB). }
                dryRun: { type: boolean }
                personMap: { type: object, additionalProperties: { type: string } }
                projectIds: { type: object, additionalProperties: { type: string, format: uuid } }
      responses:
        '200': { description: '`{ rows, totalSeconds, from, to, people[], projects[], activities[], toImport, toImportSeconds, skipped, warnings[], imported }`' }
        '403': { description: Não é administrador }
        '422': { description: Arquivo inválido ou GUID inválido }
  /settings/overtime-rules:
    put:
      operationId: updateOvertimeRules
      description: >-
        Nova versão das regras de hora adicional, válida para os lançamentos
        feitos a partir de agora. Em dia útil, conta o que fica fora do
        expediente; sábado, domingo e feriado contam o dia todo. Cada parte é
        multiplicada pelo fator do dia; a parte noturna recebe ainda o adicional
        noturno e, se ligada, a hora reduzida (52min30s). Com
        `requireTimeOfDay`, lançamento manual sem início é recusado (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                workdayStart: { type: string, example: '09:00' }
                workdayEnd: { type: string, example: '18:00', description: Depois do início. }
                factorWeekday: { type: number, minimum: 1, maximum: 5 }
                factorSaturday: { type: number, minimum: 1, maximum: 5 }
                factorSunday: { type: number, minimum: 1, maximum: 5 }
                factorHoliday: { type: number, minimum: 1, maximum: 5 }
                nightStart: { type: string, example: '22:00' }
                nightEnd: { type: string, example: '05:00' }
                nightPercent: { type: integer, minimum: 0, maximum: 100 }
                nightReducedHour: { type: boolean }
                requireTimeOfDay: { type: boolean }
                bankValidityMonths: { type: integer, minimum: 1, maximum: 12, description: Prazo para compensar o banco de horas. Omitido mantém o atual. }
                bankWeighted: { type: boolean, description: O banco recebe as horas ponderadas (com o fator). Omitido mantém o atual. }
                alertDailyExtraHours: { type: number, minimum: 0, maximum: 12, description: 'Aviso: horas extras por dia útil (padrão 2; 0 desliga). Omitido mantém o atual.' }
                alertWeeklyHours: { type: number, minimum: 0, maximum: 99, description: 'Aviso: horas por semana (padrão 44; 0 desliga).' }
                alertRestHours: { type: number, minimum: 0, maximum: 24, description: 'Aviso: descanso mínimo entre jornadas (padrão 11; 0 desliga).' }
      responses:
        '200': { description: Visão atualizada (campo `overtime`) }
        '422': { description: Valor inválido }
  /settings/holidays:
    post:
      operationId: addHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string, maxLength: 100 }
      responses:
        '200': { description: Visão atualizada (campo `holidays`) }
        '422': { description: Data já cadastrada ou inválida }
  /settings/holidays/national:
    post:
      operationId: addNationalHolidays
      description: Acrescenta os feriados nacionais do ano (inclui Sexta-feira Santa) que ainda não estão no calendário.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [year], properties: { year: { type: integer } } }
      responses:
        '200': { description: Visão atualizada }
  /settings/holidays/{holidayId}:
    delete:
      operationId: removeHoliday
      parameters:
        - { name: holidayId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Visão atualizada }
  /settings/members/{memberId}/hours-regime:
    put:
      operationId: setHoursRegime
      description: clt (hora extra, banco ou a pagar), pj (só a pagar) ou none (não controla jornada; não gera hora adicional).
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [regime], properties: { regime: { type: string, enum: [clt, pj, none] } } }
      responses:
        '200': { description: Visão atualizada }
  /settings/projects/{projectId}:
    patch:
      operationId: setProjectEnabled
      description: Projeto desabilitado recusa novos lançamentos e timers; o histórico permanece.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enabled: { type: boolean }, countsAsIdle: { type: boolean, description: 'No relatório por projeto, as horas entram em Horas Ociosas.' }, usesBillable: { type: boolean, description: 'O projeto cobra o cliente por hora; desligado (padrão), nenhuma hora dele é faturável e o campo some do lançamento.' } }, description: 'Ao menos um dos campos.' }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Projeto de outra organização ou inexistente }
  /settings/activity-types:
    post:
      operationId: createActivityType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
                defaultBillable: { type: boolean }
      responses:
        '200': { description: Visão atualizada }
        '422': { description: Nome repetido ou cor inválida }
  /settings/activity-types/{typeId}:
    patch:
      operationId: updateActivityType
      description: Renomear, recolorir, faturável padrão e habilitar/desabilitar (não há exclusão; o histórico mantém o tipo).
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                color: { type: [string, 'null'] }
                enabled: { type: boolean }
                defaultBillable: { type: boolean }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Tipo de outra organização ou inexistente }
        '422': { description: Nome repetido ou cor inválida }
  /settings/people/sync:
    post:
      operationId: syncPeople
      description: >-
        Atualiza a lista de pessoas com quem tem licença ativa no Azure DevOps
        (lida pela extensão com o acesso do administrador). Cria quem ainda não
        abriu a extensão, sem nenhum papel (sem acesso até o administrador
        liberar), atualiza nomes e marca como inativo (`directoryActive: false`)
        quem saiu da lista; nunca apaga nem altera papéis ou lançamentos. A
        identidade é comparada sem diferenciar maiúsculas. Lista vazia é recusada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [identityId, displayName]
                    properties:
                      identityId: { type: string, format: uuid }
                      displayName: { type: string, maxLength: 200 }
      responses:
        '200': { description: Visão atualizada (members com directoryActive e peopleSyncedAt) }
        '422': { description: Lista vazia ou identidade inválida }
  /settings/role-assignments:
    post:
      operationId: grantRole
      description: Concede papel (member, approver, manager, admin) na organização inteira ou num projeto. Idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, role]
              properties:
                memberId: { type: string }
                role: { type: string, enum: [member, approver, manager, admin] }
                projectId: { type: [string, 'null'] }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Pessoa ou projeto de outra organização }
        '422': { description: Papel inválido }
  /settings/role-assignments/{assignmentId}:
    delete:
      operationId: revokeRole
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Atribuição de outra organização }
        '409': { description: Seria removido o último administrador }
  /settings/approver-assignments:
    post:
      operationId: designateApprover
      description: >-
        `approverId` aprova as semanas de `memberId` (em todos os projetos ou num
        só). Resolvido no envio; `applyToPending` também reatribui as semanas
        já enviadas e pendentes dessa pessoa (decididas nunca mudam).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, approverId]
              properties:
                memberId: { type: string }
                approverId: { type: string }
                projectId: { type: [string, 'null'] }
                applyToPending: { type: boolean }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Pessoa ou projeto de outra organização }
        '422': { description: Aprovador igual à própria pessoa }
  /settings/approver-assignments/{assignmentId}:
    delete:
      operationId: removeDesignation
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { applyToPending: { type: boolean } } }
      responses:
        '200': { description: Visão atualizada }
        '404': { description: Designação de outra organização }
  /additional-hours:
    get:
      operationId: listAdditionalHours
      description: >-
        Só administradores. Horas adicionais de semanas APROVADAS no período
        (padrão: 90 dias até hoje; no máximo um ano), para classificar.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: memberId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, classified, all] } }
      responses:
        '200': { description: '`{ from, to, items[] }`; cada item traz o lançamento, a pessoa, o regime e `additional`.' }
        '403': { description: Não é administrador }
  /additional-hours/classify:
    post:
      operationId: classifyAdditionalHours
      description: >-
        Só administradores. Define o destino das horas adicionais de semanas
        aprovadas e congela os valores calculados. `pending` desfaz. Banco de
        horas só para CLT. Reabrir a semana apaga essas decisões. Tirar do
        banco horas que já foram usadas em folga ou pagamento é recusado (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryIds, classification]
              properties:
                entryIds: { type: array, items: { type: integer }, maxItems: 500 }
                classification: { type: string, enum: [overtime, bank, payable, pending] }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: '`{ updated }`' }
        '409': { description: Lançamento inexistente ou de semana não aprovada }
        '422': { description: Sem hora adicional, ou banco de horas para quem não é CLT }
  /additional-hours/closing:
    get:
      operationId: getMonthlyClosing
      description: >-
        Só administradores. Fechamento do mês para o DP, pelo dia trabalhado:
        por pessoa, linhas por categoria (overtime, payable, bank, pending =
        semana aprovada sem classificação, unapproved = semana não aprovada) e
        fator; movimento do banco no mês (crédito, folga, pagamento, ajuste,
        vencido, saldo no fim do mês); contagem de avisos de jornada. Horas,
        não valores.
      parameters:
        - { name: month, in: query, schema: { type: string, example: '2026-10' }, description: Padrão o mês atual. }
      responses:
        '200': { description: '`{ month, from, to, members[] }`' }
        '403': { description: Não é administrador }
  /additional-hours/closing.csv:
    get:
      operationId: exportMonthlyClosing
      description: Só administradores. O mesmo fechamento em CSV (UTF-8 com BOM, `;`), uma linha por pessoa, categoria e fator. Auditado (`closing.exported`).
      parameters:
        - { name: month, in: query, schema: { type: string, example: '2026-10' } }
      responses:
        '200': { description: CSV, content: { text/csv: {} } }
  /project-hours:
    get:
      operationId: getProjectHours
      description: >-
        Só administradores. Horas do mês por projeto (linhas) e pessoa
        (colunas), para o centro de custo. Base de jornada da pessoa = dias
        úteis − feriados do calendário − folgas do banco de horas dela, vezes
        `dailyHours`. TOTAL = horas nos projetos; projetos com `countsAsIdle`
        vêm zerados e entram em Horas Ociosas = base − TOTAL (nunca negativo).
      parameters:
        - { name: month, in: query, schema: { type: string, example: '2026-07' }, description: Padrão o mês atual. }
        - { name: dailyHours, in: query, schema: { type: number, minimum: 1, maximum: 24, default: 8 } }
        - { name: approvedOnly, in: query, schema: { type: boolean, default: false }, description: Só semanas aprovadas. }
      responses:
        '200': { description: '`{ month, note, weekdays, holidays[], people[], projects[], totals }`' }
        '403': { description: Não é administrador }
  /project-hours.xlsx:
    get:
      operationId: exportProjectHours
      description: Só administradores. O mesmo relatório em Excel, no formato enviado ao administrativo (horas em [h]:mm:ss). Auditado (`project_hours.exported`).
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: dailyHours, in: query, schema: { type: number } }
        - { name: approvedOnly, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Planilha, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} } }
  /me/hour-bank:
    get:
      operationId: getMyHourBank
      description: >-
        Saldo e extrato do banco de horas de quem chama. Créditos: horas
        adicionais classificadas como banco (congeladas na classificação, com
        vencimento contado do dia trabalhado). Débitos: folgas, pagamentos e
        ajustes do administrador, que consomem primeiro o crédito que vence
        antes. O que sobra no vencimento vira uma linha `expiry` e deve ser
        pago como hora extra.
      responses:
        '200': { description: '`{ member, validityMonths, summary, events[] }` (eventos em ordem cronológica, com saldo após cada um).' }
  /hour-bank:
    get:
      operationId: listHourBanks
      description: Só administradores. Saldo de cada pessoa CLT e de quem já tem movimento no banco.
      responses:
        '200': { description: '`{ members: [{ memberId, memberName, regime, summary }] }`' }
        '403': { description: Não é administrador }
  /hour-bank/{memberId}:
    get:
      operationId: getHourBank
      description: Só administradores. Mesmo formato de `/me/hour-bank`.
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Extrato }
        '403': { description: Não é administrador }
  /hour-bank/{memberId}/movements:
    post:
      operationId: addHourBankMovement
      description: >-
        Só administradores. Folga (até 90 dias à frente), pagamento em folha ou
        ajuste (hoje ou antes). Recusado (409) se alguma folga ou pagamento
        ficar sem horas para cobrir. Ajuste para mais só para CLT.
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, seconds, localDate, note]
              properties:
                kind: { type: string, enum: [time_off, payout, adjustment] }
                direction: { type: string, enum: [credit, debit], description: Só para ajuste; padrão debit. }
                seconds: { type: integer, minimum: 60, maximum: 1800000 }
                localDate: { type: string, format: date }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Extrato atualizado }
        '409': { description: Saldo insuficiente }
        '422': { description: Data, horas ou motivo inválidos }
  /hour-bank/movements/{movementId}:
    delete:
      operationId: removeHourBankMovement
      description: Só administradores. Desfaz uma folga, pagamento ou ajuste; 409 se um crédito de ajuste já foi usado.
      parameters:
        - { name: movementId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Extrato atualizado }
        '409': { description: As horas do ajuste já foram usadas }
  /admin/entries/{entryId}:
    patch:
      operationId: adminUpdateEntry
      description: >-
        Só administrador. Corrige o lançamento de qualquer pessoa da
        organização (relatório detalhado): data, horário, duração, work item
        (com o projeto do Azure DevOps), atividade, comentário e faturável. Só
        vai o que muda. Semana enviada ou aprovada (na data atual ou na nova)
        responde 409; vale o limite diário da pessoa e o intervalo dentro do
        dia, mas não a janela retroativa, o incremento nem o comentário
        obrigatório. Auditado como `time_entry.admin_updated` (antes e depois).
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                localDate: { type: string, format: date }
                startTime: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', description: 'null apaga o horário' }
                durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
                activityTypeId: { type: [integer, 'null'] }
                note: { type: [string, 'null'], maxLength: 2000 }
                billable: { type: boolean }
                workItemId: { type: integer, minimum: 1 }
                projectId: { type: string, description: 'GUID do projeto no Azure DevOps; obrigatório com workItemId' }
                projectName: { type: string, description: 'Obrigatório com workItemId' }
                title: { type: string }
                workItemType: { type: string }
                iterationPath: { type: string, maxLength: 500 }
      responses:
        '200': { description: Lançamento corrigido (Entry) }
        '403': { description: Não é administrador }
        '404': { description: Lançamento inexistente ou de outra organização }
        '409': { description: Semana enviada/aprovada ou revisão divergente }
        '422': { description: Limite diário, horário passando da meia-noite ou dado inválido }
    delete:
      operationId: adminDeleteEntry
      description: Só administrador. Exclui o lançamento de qualquer pessoa (semana aberta). Auditado como `time_entry.admin_deleted`.
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Excluído }
        '403': { description: Não é administrador }
        '404': { description: Lançamento inexistente ou de outra organização }
        '409': { description: Semana enviada ou aprovada }
  /reports/time/detail:
    get:
      operationId: getReportDetail
      description: >-
        Todas as linhas do filtro de uma vez (até 20.000), para a grade
        detalhada. Mesmos filtros, escopo, ordem e totais de `/reports/time` e
        do CSV. Cada linha traz também `workItemType`, `iterationPath` (do
        retrato mais recente do work item) e `startTime`/`endTime` (hora local
        HH:MM; nulos em lançamento manual). `truncated: true` quando o filtro
        tem mais linhas do que o limite; `totals` continua sendo o do filtro
        inteiro. Cada linha traz `revision` (If-Match da correção) e a resposta
        traz `canEditEntries` (true para administrador).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: projectId, in: query, schema: { type: integer } }
        - { name: memberId, in: query, schema: { type: integer } }
        - { name: activityTypeId, in: query, schema: { type: integer } }
        - { name: billable, in: query, schema: { type: string, enum: ['0', '1', 'true', 'false'] } }
        - { name: status, in: query, schema: { type: string, enum: [open, submitted, rejected, approved] } }
      responses:
        '200': { description: 'Objeto com scope, totals, rows, truncated e canEditEntries' }
        '403': { description: Filtro fora do escopo da pessoa }
  /reports/options:
    get:
      operationId: getReportOptions
      description: Opções dos filtros (pessoas, projetos, atividades) limitadas ao escopo de quem pergunta.
      responses:
        '200': { description: 'Opções + `scope` ({ level: all|projects|self, canFilterByMember }); cada projeto traz `usesBillable`.' }
  /reports/time:
    get:
      operationId: getTimeReport
      description: >-
        Escopo aplicado no servidor: cada pessoa vê as próprias horas; gestor
        vê todas nos projetos que gerencia; administrador vê a organização.
        `projectId`/`memberId` fora do escopo respondem 403; o restante é
        interseção com o escopo. Totais e quebras cobrem todos os filtros; só
        `rows` é paginada. Ids (`projectId`, `memberId`, `activityTypeId`) são
        os opacos devolvidos por /reports/options.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'Máximo de 366 dias a partir de `from`.' }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: memberId, in: query, schema: { type: string } }
        - { name: workItemId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: activityTypeId, in: query, schema: { type: string } }
        - { name: billable, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: status, in: query, description: Estado da semana do lançamento., schema: { type: string, enum: [open, submitted, rejected, approved] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 'Totais (total/faturável/não faturável/contagem), `byMember`/`byProject`/`byActivity`, `rows` paginadas e `pagination`.'
        '403': { description: Escopo não autorizado }
        '422': { description: Filtro inválido ou período maior que 366 dias }
  /reports/time.csv:
    get:
      operationId: exportTimeCsv
      description: >-
        Mesmos filtros, escopo e consulta de /reports/time (sem paginação):
        as linhas e a soma de segundos são as da tela. UTF-8 com BOM, separador
        `;`, textos livres protegidos contra injeção de fórmula. Registra o
        evento `report.exported` (filtros, escopo, linhas e total).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: memberId, in: query, schema: { type: string } }
        - { name: workItemId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: activityTypeId, in: query, schema: { type: string } }
        - { name: billable, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: status, in: query, schema: { type: string, enum: [open, submitted, rejected, approved] } }
      responses:
        '200':
          description: CSV UTF-8 (arquivo `horas_{from}_a_{to}.csv`).
          content:
            text/csv:
              schema: { type: string }
        '403': { description: Escopo não autorizado }
        '422': { description: Filtro inválido }
